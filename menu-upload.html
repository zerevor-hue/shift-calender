<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>식단표 업로드</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bd:#30363d;--tx:#e6edf3;--tx2:#8b949e;--tx3:#484f58;--a:#58a6ff;--ok:#3fb950;--ok-bg:rgba(63,185,80,.12);--ng:#f85149;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nanum Gothic',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:500px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:14px}
.ph{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.sub{font-size:.75rem;color:var(--tx3);margin-bottom:18px}
.lbl{display:block;font-size:.68rem;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input:not([type="file"]),select{font-family:inherit;width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);padding:11px 13px;border-radius:var(--rs);font-size:.9rem;outline:none;-webkit-appearance:none;margin-bottom:12px}
input:focus,select:focus{border-color:var(--a)}
button{font-family:inherit;cursor:pointer;border:none;width:100%;padding:13px;border-radius:var(--rs);font-size:.9rem;font-weight:700;transition:all .15s;margin-bottom:8px}
button:active{filter:brightness(.85)}
.pri{background:var(--a);color:#000}
.sec{background:var(--bg3);color:var(--tx2);border:1px solid var(--bd)}
.dan{background:rgba(248,81,73,.13);color:var(--ng);border:1px solid rgba(248,81,73,.28)}

/* 라벨(버튼 역할) 스타일 */
.preview-wrap{width:100%;aspect-ratio:4/3;background:var(--bg3);border:2px dashed var(--bd);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;cursor:pointer;position:relative}

/* 내부 요소들 터치 무시 강제 (iOS 호환성 핵심) */
.preview-wrap > div, .preview-wrap > img { pointer-events: none; }
.preview-wrap img{width:100%;height:100%;object-fit:contain}
.ph-icon{font-size:2.8rem;margin-bottom:8px}
.ph-txt{font-size:.82rem;color:var(--tx3)}

/* 인앱 브라우저 호환성을 위한 파일 입력창 숨김 처리 (웹 표준 방식) */
input[type=file] {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}

.progress-wrap{background:var(--bg3);border-radius:6px;overflow:hidden;height:10px;margin-bottom:10px;display:none}
.progress-bar{height:100%;background:var(--a);transition:width .2s;width:0%}
.progress-label{font-size:.7rem;color:var(--tx2);margin-bottom:6px;display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:.8rem;font-weight:700;opacity:0;transition:all .18s;z-index:100;text-align:center;max-width:90%}
.toast.sh{opacity:1;transform:translateX(-50%) translateY(0)}
.menu-item{background:var(--bg3);border-radius:var(--rs);overflow:hidden;margin-bottom:10px}
.menu-item img{width:100%;display:block;max-height:220px;object-fit:cover;cursor:zoom-in}
.menu-info{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.menu-date{font-size:.78rem;font-weight:700;color:var(--a)}
.menu-desc{font-size:.7rem;color:var(--tx2);margin-top:2px}
.del-btn{background:rgba(248,81,73,.13);color:var(--ng);border:none;border-radius:6px;padding:5px 10px;font-size:.7rem;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;width:auto}
.sp{width:18px;height:18px;border:2px solid var(--bd);border-top-color:var(--a);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.25);border-radius:var(--rs);padding:10px 12px;font-size:.78rem;color:var(--ng);margin-bottom:10px;display:none;line-height:1.6}
.suc-box{background:var(--ok-bg);border:1px solid rgba(63,185,80,.25);border-radius:var(--rs);padding:10px 12px;font-size:.78rem;color:var(--ok);margin-bottom:10px;display:none}
/* 이미지 확대 */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center;display:none}
#lightbox img{max-width:95%;max-height:90vh;object-fit:contain}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-section" style="max-width:360px;margin:50px auto 0">
  <div style="text-align:center;margin-bottom:24px">
    <div style="font-size:2.2rem;margin-bottom:10px">🍽</div>
    <div class="ph" style="text-align:center">식단표 업로드</div>
    <div class="sub" style="text-align:center">교대근무 달력과 동일한 계정으로 로그인</div>
  </div>
  <div class="card">
    <div class="lbl">이름</div>
    <input type="text" id="ln" placeholder="이름 입력" maxlength="10"
      onkeydown="if(event.key==='Enter')document.getElementById('lp').focus()">
    <div class="lbl">비밀번호</div>
    <input type="password" id="lp" placeholder="비밀번호 입력" maxlength="20"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err-box" id="lerr"></div>
    <button class="pri" id="lbtn" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- 업로드 UI -->
<div id="upload-section" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div class="ph" style="margin-bottom:0">🍽 식단표 업로드</div>
    <span id="user-badge"
      style="font-size:.75rem;font-weight:700;padding:4px 10px;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;color:var(--a)"></span>
  </div>

  <div class="card">
    <div class="lbl">날짜</div>
    <input type="date" id="menu-date">
    <div class="lbl">설명 (선택)</div>
    <input type="text" id="menu-desc" placeholder="예: 10월 1주차 점심 메뉴" maxlength="40">
    <div class="lbl">이미지 <span style="color:var(--tx3);font-size:.65rem;font-weight:400">(탭하여 선택 · 자동 압축)</span></div>
    
    <!-- 터치 영역 (label 활용) -->
    <label class="preview-wrap" for="img-input">
      <div id="ph-content" style="text-align:center">
        <div class="ph-icon">📷</div>
        <div class="ph-txt">탭하여 이미지 선택</div>
      </div>
      <img id="preview-img" style="display:none">
    </label>
    <!-- 실제 인풋: accept 속성 강화 및 sr-only 처리 -->
    <input type="file" id="img-input" accept="image/*, image/jpeg, image/png, image/heic" onchange="onImageSelect(this)">
    
    <div class="progress-label" id="prog-label">압축 및 업로드 중...</div>
    <div class="progress-wrap" id="prog-wrap"><div class="progress-bar" id="prog-bar"></div></div>
    <div class="err-box" id="upload-err"></div>
    <div class="suc-box" id="upload-suc">✓ 업로드 완료!</div>
    <button class="pri" id="upload-btn" onclick="uploadMenu()">업로드</button>
    <button class="sec" onclick="clearForm()">초기화</button>
  </div>

  <!-- 최근 목록 -->
  <div style="font-size:.72rem;font-weight:700;color:var(--tx3);margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase">최근 업로드</div>
  <div id="menu-list">
    <div style="text-align:center;padding:20px;color:var(--tx3)"><div class="sp"></div></div>
  </div>
</div>

<!-- 이미지 확대 -->
<div id="lightbox" onclick="this.style.display='none'">
  <img id="lb-img">
</div>

<div class="toast" id="toast"></div>

<script>
// ── Firebase 초기화 ──────────────────────────────────────
const CFG={
  apiKey:"AIzaSyCnpGR_zNBP-9quyF-OCnDC_4FbG4w8xlc",
  authDomain:"shift-calender-17a58.firebaseapp.com",
  databaseURL:"https://shift-calender-17a58-default-rtdb.firebaseio.com",
  projectId:"shift-calender-17a58",
  storageBucket:"shift-calender-17a58.firebasestorage.app",
  messagingSenderId:"434862222996",
  appId:"1:434862222996:web:e7e2a67c5188542bc90e81",
};
firebase.initializeApp(CFG);
const db=firebase.database();
const storage=firebase.storage();

let myName='',selectedFile=null;
let toastT;

function showToast(m){
  const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('sh');clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('sh'),3000);
}
function showErr(id,m){const e=document.getElementById(id);e.innerHTML=m;e.style.display='';}
function hideErr(id){document.getElementById(id).style.display='none';}

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sc2025'+pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20);
}

// ── 자동 로그인 (메인 앱과 localStorage 공유) ────────────
function tryAutoLogin(){
  try{
    const sess=JSON.parse(localStorage.getItem('sess')||'null');
    if(sess&&sess.name){
      myName=sess.name;
      enterApp();
      return true;
    }
  }catch(e){}
  return false;
}

async function doLogin(){
  const name=document.getElementById('ln').value.trim();
  const pw=document.getElementById('lp').value;
  if(!name||!pw){showErr('lerr','이름과 비밀번호를 입력해주세요');return;}
  const btn=document.getElementById('lbtn');
  btn.innerHTML='<div class="sp" style="margin:0 auto"></div>';
  hideErr('lerr');
  try{
    const hash=await hashPw(pw);
    const acct=await db.ref('accounts/'+name).once('value');
    if(!acct.exists()||acct.val().pwHash!==hash){
      showErr('lerr','이름 또는 비밀번호가 틀렸습니다');
      btn.textContent='로그인';return;
    }
    myName=name;
    // 세션 저장
    const saved=JSON.parse(localStorage.getItem('sess')||'null');
    if(!saved)localStorage.setItem('sess',JSON.stringify({name,id:acct.val().myId,color:acct.val().color}));
    enterApp();
  }catch(e){
    showErr('lerr','오류: '+e.message);btn.textContent='로그인';
  }
}

function enterApp(){
  document.getElementById('login-section').style.display='none';
  document.getElementById('upload-section').style.display='';
  document.getElementById('user-badge').textContent=myName;
  document.getElementById('menu-date').value=new Date().toISOString().slice(0,10);
  loadMenuList();
}

// ── 이미지 압축 (Canvas) ──────────────────────────────────
function compressImage(file,maxPx=1400,quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxPx||h>maxPx){
          if(w>h){h=Math.round(h*maxPx/w);w=maxPx;}
          else{w=Math.round(w*maxPx/h);h=maxPx;}
        }
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(blob)resolve(blob);
          else reject(new Error('압축 실패'));
        },'image/jpeg',quality);
      };
      img.onerror=()=>reject(new Error('이미지 로드 실패'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('파일 읽기 실패'));
    reader.readAsDataURL(file);
  });
}

function onImageSelect(inp){
  const file=inp.files[0];if(!file)return;
  selectedFile=file;
  const url=URL.createObjectURL(file);
  document.getElementById('preview-img').src=url;
  document.getElementById('preview-img').style.display='';
  document.getElementById('ph-content').style.display='none';
  hideErr('upload-err');
  document.getElementById('upload-suc').style.display='none';
}

// ── 업로드 ────────────────────────────────────────────────
async function uploadMenu(){
  const date=document.getElementById('menu-date').value;
  const desc=document.getElementById('menu-desc').value.trim();
  if(!date){showToast('날짜를 선택해주세요');return;}
  if(!selectedFile){showToast('이미지를 선택해주세요');return;}
  hideErr('upload-err');
  document.getElementById('upload-suc').style.display='none';

  const btn=document.getElementById('upload-btn');
  btn.disabled=true;btn.textContent='처리 중...';
  document.getElementById('prog-wrap').style.display='';
  document.getElementById('prog-label').style.display='';
  document.getElementById('prog-bar').style.width='5%';

  try{
    btn.textContent='압축 중...';
    const blob=await compressImage(selectedFile);
    document.getElementById('prog-bar').style.width='20%';
    const sizeMB=(blob.size/1024/1024).toFixed(1);

    btn.textContent='업로드 중...';
    const path=`menus/${date}_${Date.now()}.jpg`;
    const ref=storage.ref(path);
    const task=ref.put(blob,{contentType:'image/jpeg'});

    task.on('state_changed',snap=>{
      const pct=20+(snap.bytesTransferred/snap.totalBytes)*70;
      document.getElementById('prog-bar').style.width=pct+'%';
    });

    await task;
    document.getElementById('prog-bar').style.width='95%';

    const url=await ref.getDownloadURL();

    await db.ref('menus/'+date).push({
      url,desc,uploadedBy:myName,
      uploadedAt:Date.now(),sizeMB
    });

    document.getElementById('prog-bar').style.width='100%';
    document.getElementById('upload-suc').textContent=`✓ 업로드 완료! (${sizeMB}MB)`;
    document.getElementById('upload-suc').style.display='';
    clearForm();loadMenuList();

  }catch(e){
    let msg='업로드 실패: '+e.message;
    showErr('upload-err',msg.replace(/\n/g,'<br>'));
  }finally{
    btn.disabled=false;btn.textContent='업로드';
    document.getElementById('prog-wrap').style.display='none';
    document.getElementById('prog-label').style.display='none';
  }
}

function clearForm(){
  selectedFile=null;
  document.getElementById('preview-img').src='';
  document.getElementById('preview-img').style.display='none';
  document.getElementById('ph-content').style.display='';
  
  const inp=document.getElementById('img-input');
  inp.value='';
  
  document.getElementById('menu-desc').value='';
}

// ── 목록 ──────────────────────────────────────────────────
async function loadMenuList(){
  const box=document.getElementById('menu-list');
  box.innerHTML='<div style="text-align:center;padding:16px;color:var(--tx3)"><div class="sp"></div></div>';
  try{
    const snap=await db.ref('menus').once('value');
    box.innerHTML='';
    if(!snap.exists()){
      box.innerHTML='<div style="text-align:center;padding:16px;color:var(--tx3);font-size:.8rem">업로드된 식단표가 없어요</div>';
      return;
    }
    const entries=[];
    snap.forEach(daySnap=>{
      daySnap.forEach(itemSnap=>{
        entries.push({dateKey:daySnap.key,id:itemSnap.key,...itemSnap.val()});
      });
    });
    entries.sort((a,b)=>b.uploadedAt-a.uploadedAt);
    entries.forEach(item=>{
      const dt=new Date(item.dateKey+'T00:00:00');
      const dateStr=`${dt.getMonth()+1}월 ${dt.getDate()}일 (${['일','월','화','수','목','금','토'][dt.getDay()]})`;
      const div=document.createElement('div');div.className='menu-item';
      div.innerHTML=`
        <img src="${item.url}" loading="lazy"
          onclick="document.getElementById('lb-img').src='${item.url}';document.getElementById('lightbox').style.display='flex'"
          onerror="this.style.display='none'">
        <div class="menu-info">
          <div style="flex:1;min-width:0">
            <div class="menu-date">${dateStr}</div>
            ${item.desc?`<div class="menu-desc">${item.desc}</div>`:''}
            <div style="font-size:.62rem;color:var(--tx3);margin-top:2px">${item.uploadedBy||''}${item.sizeMB?' · '+item.sizeMB+'MB':''}</div>
          </div>
          <button class="del-btn" onclick="deleteMenu('${item.dateKey}','${item.id}')">삭제</button>
        </div>`;
      box.appendChild(div);
    });
  }catch(e){
    box.innerHTML=`<div style="text-align:center;padding:16px;color:var(--ng);font-size:.8rem">불러오기 실패: ${e.message}</div>`;
  }
}

async function deleteMenu(dateKey,id){
  if(!confirm('삭제하시겠어요?'))return;
  await db.ref(`menus/${dateKey}/${id}`).remove();
  showToast('삭제됨');loadMenuList();
}

// ── 초기화 ────────────────────────────────────────────────
(function init(){
  if(!tryAutoLogin()){
    document.getElementById('login-section').style.display='';
  }
})();
</script>
</body>
</html>
