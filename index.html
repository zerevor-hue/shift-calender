<style>
:root{
  --a:#f59e0b;--as:#fcd34d;--n:#818cf8;--ns:#a5b4fc;--vac:#34d399;--red:#f87171;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;transition:background-color .18s,color .18s,border-color .18s}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Nanum Gothic',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:480px;margin:0 auto}

#splash, #login-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}

.lcard{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:20px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:11px}
.qbtn{width:100%;max-width:340px;background:var(--bg2);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 16px;display:flex;align-items:center;gap:10px;font-family:inherit;font-size:.85rem;font-weight:700;color:var(--tx2);cursor:pointer;text-align:left}

.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:13px 0 11px;gap:4px;background:none;border:none;color:var(--tx3);font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer;min-height:60px}
.ni.on{color:var(--a)}.ni-ico{font-size:1.55rem;line-height:1}

.page{display:none;padding:16px 12px 100px;min-height:100vh;animation:fu .22s ease}

.pri{background:var(--a);color:#000;border-color:var(--a)}
.sec{background:var(--bg3);color:var(--tx2);border-color:var(--bd)}

.sstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}

.stk-d{color:var(--a);}.stk-n{color:var(--n);}

.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dtab{padding:6px 14px;border-radius:var(--rs);font-size:.78rem;font-weight:700;border:1.5px solid var(--bd);background:var(--bg3);color:var(--tx2);cursor:pointer;font-family:inherit}
.dtab.on{background:var(--a);color:#000;border-color:var(--a)}

.sov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.sov.op{opacity:1;pointer-events:all}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--bd2);border-radius:18px 18px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0));transform:translateY(110%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto}
.sov.op .sheet{transform:translateY(0)}
.shandle{width:34px;height:4px;background:var(--bd2);border-radius:2px;margin:10px auto 14px}
.stitle-s{font-size:.95rem;font-weight:800;margin-bottom:16px}
.spicker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sopt{display:none}
.slbl{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;border-radius:var(--rs);border:2px solid var(--bd);cursor:pointer;font-size:.66rem;font-weight:700;color:var(--tx2);text-align:center;line-height:1.3}
.sopt:checked+.slbl{border-color:currentColor;background:rgba(255,255,255,.06)}
.sl-dr{color:var(--a)}.sl-ds{color:var(--as)}.sl-nr{color:var(--n)}.sl-ns{color:var(--ns)}.sl-of{color:var(--tx2)}.sl-vc{color:var(--vac)}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:22px;font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;transition:all .18s;white-space:nowrap;z-index:300}
.toast.sh{opacity:1;transform:translateX(-50%) translateY(0)}
.sp{width:17px;height:17px;border:2px solid var(--bd2);border-top-color:var(--a);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{display:none}
</style>
</head>

<script>
const ADMIN_NAME='정호철';
const SM={
  dr:{l:'주간정규',i:'☀️',c:'cb-dr',tc:'tc-dr',s:'주'},
  ds:{l:'주간대근',i:'🌤',c:'cb-ds',tc:'tc-ds',s:'주대'},
  nr:{l:'야간정규',i:'🌙',c:'cb-nr',tc:'tc-nr',s:'야'},
  ns:{l:'야간대근',i:'🌛',c:'cb-ns',tc:'tc-ns',s:'야대'},
  of:{l:'휴무',i:'🏠',c:'cb-of',tc:'tc-of',s:'휴'},
  vc:{l:'연차',i:'🌴',c:'cb-vc',tc:'tc-vc',s:'연'},
};
const CL={dr:'주간',ds:'주(대)',nr:'야간',ns:'야(대)',of:'휴무',vc:'연차'};
const COLORS=['#f59e0b','#6366f1','#10b981','#f43f5e','#3b82f6','#8b5cf6','#ec4899','#14b8a6'];

let holidays={}; 
let S={myName:'',myColor:'',myId:'',isAdmin:false,yr:0,mo:0,ov:{},topId:'',topName:'',topColor:'',divId:'',divName:'',patCache:{}};
let FB=null;

const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uid=()=>Math.random().toString(36).slice(2,9).toUpperCase();
const ls={s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},g:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}},d:k=>{try{localStorage.removeItem(k)}catch{}}};
const cs=id=>document.getElementById(id).classList.remove('op');
const os=id=>document.getElementById(id).classList.add('op');

function getBaseShift(date,topId,divId){
  const tp=S.patCache[`${topId||S.topId}_${divId||S.divId}`];
  if(!tp||!tp.pattern||!tp.patternStart)return null;
  const diff=Math.floor((date-new Date(tp.patternStart))/86400000);
  return diff>=0?tp.pattern[diff%tp.pattern.length]:null;
}
function getShift(date){return S.ov[dkey(date)]?.shift||getBaseShift(date);}

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sc2025'+pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20);
}
async function saveProfile(){
  if(!S.myId)return;
  const d={myName:S.myName,myColor:S.myColor,ov:S.ov,topId:S.topId,topName:S.topName,topColor:S.topColor,divId:S.divId,divName:S.divName};
  await FB.set('profiles/'+S.myId,d); ls.s('prof_'+S.myId,d);
}
async function loadProfile(){
  let d=await FB.get('profiles/'+S.myId)||ls.g('prof_'+S.myId);
  if(d){ Object.assign(S,d); }
}

async function doLogin(){
  const name=document.getElementById('ln').value.trim(),pw=document.getElementById('lp').value;
  if(!name||!pw){showErr('이름과 비밀번호를 입력해주세요');return;}
  document.getElementById('lbtn').innerHTML='<div class="sp"></div>';
  try{
    const hash=await hashPw(pw), acct=await FB.get('accounts/'+name);
    if(acct){
      if(acct.pwHash!==hash){showErr('비밀번호 오류');return;}
      S.myId=acct.myId; S.myColor=acct.color;
    } else {
      const myId=uid(),color=COLORS[Math.floor(Math.random()*COLORS.length)];
      await FB.set('accounts/'+name,{pwHash:hash,myId,color,createdAt:Date.now()});
      S.myId=myId; S.myColor=color;
    }
    S.myName=name; S.isAdmin=(name===ADMIN_NAME); await loadProfile();
    ls.s('sess',{name,id:S.myId,color:S.myColor});
    document.getElementById('login-screen').classList.add('h'); await boot();
  }catch(e){showErr('네트워크 오류');}
}
function showErr(msg){document.getElementById('lerr').textContent=msg;document.getElementById('lerr').style.display='';document.getElementById('lbtn').textContent='로그인';}
function doLogout(){if(confirm('로그아웃 할까요?')){ls.d('sess');location.reload();}}

const TABS=['cal','tcal','dg','meal','settings'];
function goTab(t){ TABS.forEach(x=>{document.getElementById('page-'+x).classList.toggle('on',x===t);document.getElementById('ni-'+x).classList.toggle('on',x===t);}); }

// --- 🚀 [최적화 1] 달력 렌더링 시 1회 파싱으로 병목 제거 ---
async function refreshCal(){
  let parsedPats = [];
  if(S.topId){
    const divs = await FB.get(`teams/${S.topId}/divs`);
    window._allPatsCache = {};
    if(divs){
      Object.entries(divs).forEach(([dId, dData]) => {
        if(dData.pattern?.patternStart && !dData.name.includes('일근') && !dData.name.includes('통상')) {
          window._allPatsCache[dData.name] = dData.pattern;
          parsedPats.push({
            name: dData.name.length >= 2 ? dData.name.substring(0, 2) : dData.name,
            startMs: new Date(dData.pattern.patternStart).getTime(),
            pat: dData.pattern.pattern,
            len: dData.pattern.pattern.length
          });
        }
      });
    }
  }

  if(S.topId&&S.divId){
    const tp=await FB.get(`teams/${S.topId}/divs/${S.divId}/pattern`);
    if(tp)S.patCache[`${S.topId}_${S.divId}`]=tp;
    document.getElementById('cal-badge-dot').style.background=S.topColor||'#f59e0b';
    document.getElementById('cal-badge-name').textContent=`${S.topName}${S.divName?' · '+S.divName:''}`;
    document.getElementById('cal-badge').style.display='flex';
    
    if(window.Android&&S.myId){
      try{
        window.Android.savePattern(JSON.stringify({
          patternStartKey: tp?.patternStart ? dkey(new Date(tp.patternStart)) : "",
          pattern: tp?.pattern || [],
          ov: S.ov,
          name: S.myName||'',
          topName: S.topName||'',
          divName: S.divName||'',
          allPats: window._allPatsCache || {}
        }));
      }catch(e){}
    }
  }
  renderCal(parsedPats);
}

function renderCal(parsedPats = []){
  const{yr,mo}=S;
  document.getElementById('cal-month').textContent=`${yr}년 ${mo+1}월`;
  const grid=document.getElementById('days-grid');grid.innerHTML='';
  const first=new Date(yr,mo,1), last=new Date(yr,mo+1,0);
  
  for(let i=0;i<first.getDay();i++) grid.appendChild(mkCell(new Date(yr,mo,i-first.getDay()+1),true,parsedPats));
  for(let d=1;d<=last.getDate();d++) grid.appendChild(mkCell(new Date(yr,mo,d),false,parsedPats));
  const trail=(7-(first.getDay()+last.getDate())%7)%7;
  for(let i=1;i<=trail;i++) grid.appendChild(mkCell(new Date(yr,mo+1,i),true,parsedPats));
  
  const cells=grid.querySelectorAll('.dc'),tot=cells.length;
  for(let i=tot-7;i<tot;i++) cells[i].classList.add('lr');
  
  if(window.Android&&S.myId){
    try{
      const todaySh=getShift(new Date());
      window.Android.updateShift(JSON.stringify({
        shift:todaySh||'none',
        shiftLabel:todaySh?SM[todaySh].l:'없음',
        name:S.myName||'',
        topName:S.topName||'',
        divName:S.divName||'',
        date:dkey(new Date()) 
      }));
    }catch(e){}
  }
}

// --- 🚀 [최적화 2] DOM 조작 최소화 및 고속 텍스트 스티커 렌더링 ---
function mkCell(date,other,parsedPats){
  const c=document.createElement('div');c.className='dc';
  if(other){c.classList.add('om');return c;}
  const dow=date.getDay();
  if(dow===0)c.classList.add('sun');if(dow===6)c.classList.add('sat');
  if(date.toDateString()===new Date().toDateString())c.classList.add('td');
  
  const sh=getShift(date), isOv=!!S.ov[dkey(date)];
  const row=document.createElement('div');row.className='dr';
  row.innerHTML = `<div class="dn">${date.getDate()}</div>`;
  
  if(sh){
    const b=document.createElement('div');
    b.className=`cb ${sh==='of'?'cb-of':SM[sh].c}`;
    b.textContent=CL[sh];
    if(isOv)b.style.outline='1.5px solid currentColor';
    row.appendChild(b);
  }
  c.appendChild(row);
  
  const memo=S.ov[dkey(date)]?.memo;
  if(memo){const m=document.createElement('div');m.className='cm';m.textContent='📝'+memo;c.appendChild(m);}
  const hd=holidays[dkey(date)];
  if(hd){
    c.classList.add('hday');
    if(hd.type==='substitute')c.classList.add('hday-sub');
    const hn=document.createElement('div');hn.className='hd';hn.textContent=hd.name;c.appendChild(hn);
  }

  // 1~4과 스티커 계산 (빠른 루프)
  let dtMs = date.getTime();
  let dayTeam='', nightTeam='';
  for(let p of parsedPats){
    let diff = Math.floor((dtMs - p.startMs)/86400000);
    if(diff>=0){
      let s = p.pat[diff % p.len];
      if(s==='dr'||s==='ds') dayTeam = p.name;
      if(s==='nr'||s==='ns') nightTeam = p.name;
    }
  }

  // 스티커 태그 추가 (테두리 없이 깔끔하게)
  if(dayTeam || nightTeam){
    const sw=document.createElement('div');sw.className='stk-wrap';
    if(dayTeam) sw.innerHTML+=`<div class="stk stk-d">${dayTeam}</div>`;
    if(nightTeam) sw.innerHTML+=`<div class="stk stk-n">${nightTeam}</div>`;
    c.appendChild(sw);
  }

  c.addEventListener('click',()=>openDaySheet(date));
  return c;
}

function changeMonth(d){S.mo+=d;if(S.mo>11){S.mo=0;S.yr++;}if(S.mo<0){S.mo=11;S.yr--;}refreshCal();}
function gotoToday(){const t=new Date();S.yr=t.getFullYear();S.mo=t.getMonth();refreshCal();}

let editDate=null;
function openDaySheet(date){
  editDate=date;
  const k=dkey(date),sh=getShift(date)||'of',memo=S.ov[k]?.memo||'';
  document.getElementById('day-st').textContent=`${date.getMonth()+1}월 ${date.getDate()}일`;
  document.querySelectorAll('input[name="sh"]').forEach(r=>r.checked=r.value===sh);
  document.getElementById('day-memo').value=memo;
  os('day-sov');
}
async function saveDaySheet(){
  if(!editDate)return;
  const k=dkey(editDate),sh=document.querySelector('input[name="sh"]:checked')?.value, memo=document.getElementById('day-memo').value.trim();
  const bSh=getBaseShift(editDate);
  if(sh===bSh&&!memo){delete S.ov[k];}
  else{if(!S.ov[k])S.ov[k]={};if(sh)S.ov[k].shift=sh;if(memo)S.ov[k].memo=memo;else delete S.ov[k].memo;}
  cs('day-sov');refreshCal();await saveProfile();showToast('저장됨 ✓');
}

let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('sh');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('sh'),2000);}

async function boot(){
  const t=new Date(); S.yr=t.getFullYear();S.mo=t.getMonth();
  document.getElementById('av').textContent=S.myName?S.myName[0]:'?';
  document.getElementById('av').style.background=S.myColor;
  document.getElementById('av-name').textContent=S.myName;
  await refreshCal();
}

async function onFbReady(){
  FB=window._fb; const sess=ls.g('sess');
  if(sess?.name&&sess?.id){
    S.myId=sess.id;S.myName=sess.name;S.myColor=sess.color||COLORS[0];S.isAdmin=(sess.name===ADMIN_NAME);
    await loadProfile(); document.getElementById('splash').classList.add('h'); await boot(); return;
  }
  document.getElementById('splash').classList.add('h');document.getElementById('login-screen').classList.remove('h');
}
if(window._fbReady){onFbReady();}else{window.addEventListener('fbReady',onFbReady,{once:true});}
</script>
